<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | THE SMART MODERN PUBLIC SCHOOL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="form-container">
    <div class="form-header">
      <div class="icon"><i class="fas fa-graduation-cap"></i></div>
      <h2>Student Login</h2>
      <p>THE SMART MODERN PUBLIC SCHOOL</p>
    </div>
    <form id="student-login-form">
      <div class="form-group">
        <label>Student ID / Username</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. student1 or STU001" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg">Login</button>
      <div class="form-footer">
        <a href="#">Forgot Password?</a> · <a href="index.html">Back to Home</a>
      </div>
      <div class="form-footer" style="margin-top:1rem;font-size:0.8rem;background:var(--gray-50);padding:0.75rem;border-radius:8px;">
        <strong>Demo:</strong> username: <code>student1</code> / password: <code>student123</code>
      </div>
    </form>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    handleLogin('student-login-form', 'student', 'student-dashboard.html');
  </script>
</body>
</html>
